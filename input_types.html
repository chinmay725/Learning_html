<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <h1>HTML Input Types</h1>
    <form>

        <label>Enter Your Name</label>
        <input type="text" placeholder="Enter Your Name" /> <br><br>

        <label>Enter Your Email</label>
        <input type="Email" placeholder="Enter Your Email" /><br><br>

        <label>Enter Your password</label>
        <input type="password" placeholder="Enter Your password" /><br><br>

        <label>Enter Your Number</label>
        <input type="number" placeholder="Enter Your Number" /><br><br>

        <label>Enter DOB</label>
        <input type="date" /><br><br>

        <label>Enter Month</label>
        <input type="month" /><br><br>

        <label>Enter Week</label>
        <input type="week" /><br><br>

        <label>Enter Time</label>
        <input type="time" /><br><br>

        <label>Date & Time</label>
        <input type="datetime-local" /><br><br>


        <label>Choose Cities</label>
        <input type="checkbox" checked>Mumbai
        <input type="checkbox" checked>Pune
        <input type="checkbox" checked>Nashik
        <input type="checkbox" checked>Ambajogai<br><br>


        <label>Select Gender</label>
        <input type="radio" name="gender" />Male
        <input type="radio" name="gender" />Female
        <input type="radio" name="gender" />Other <br><br>

        <label>Select Color</label>
        <input type="color">

        <label>Select Range</label>
        <input type="range"> <br><br>

        <label>Upload Your File</label>
        <input type="file"> <br><br>

        <label>Select Fav Dish</label>
        <select>

            <option>Choose....</option>
            <option>Puran Poli</option>
            <option>Pizza</option>
            <option>Aamras</option>
            <option>Noodels</option>
            <option>Manchurian</option> <br><br>

        </select>

        <label>Enter Address</label>
        <textarea rows="5" cols="20"></textarea>

        <input type="submit" value="submit">
        <input type="button" value="submit">
        <input type="reset" value="reset"> <br><br>

        

    </form>


</body>

</html>
